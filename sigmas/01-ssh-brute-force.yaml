title: Multiple Failed SSH Logins
id: 7a3f1c2e-4b8d-4e9a-b5c1-2d6e8f0a1b3c
status: experimental
description: Detects repeated SSH authentication failures from a single source IP
author: WardCraftSec
date: 2026-10-27
logsource:
    product: linux
    service: sshd
detection:
    selection_failed:
        message|contains: "Failed password for"
    selection_invalid:
        message|contains: "Invalid user"
    timeframe: 5m
    condition: (selection_failed or selection_invalid) | count() by src_ip > 5
level: high
falsepositives:
    - Legitimate user repeatedly mistyping password
    - Automated deployment scripts with key auth fallback
references:
    - https://attack.mitre.org/techniques/T1110/001/
tags:
    - attack.credential_access
    - attack.t1110.001   
